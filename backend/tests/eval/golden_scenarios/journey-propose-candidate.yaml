scenario_id: journey-propose-candidate
description: >
  User provides sufficient requirements. The assistant should enter propose_candidate
  stage and return a response containing candidate name, components, trade-offs, and
  WAF mapping. A thin receipt should fail.
input: "Design a microservices architecture for a high-availability e-commerce platform on Azure with 99.99% SLA, GDPR compliance, and a budget of $10k/month"
stage: propose_candidate
expected_fields:
  - "stage"
  - "summary"
  - "nextStep"
  - "reasoningSummary"
forbidden_patterns:
  - "(?i)^I've saved"
  - "(?i)^I've created a change set"
  - "(?i)recorded successfully"
thin_receipt_detection:
  max_length: 200
  required_keywords:
    - "recommend"
    - "trade-off"
    - "risk"
quality_assertions:
  required_concepts:
    recommendation: ["recommend", "propose"]
    rationale: ["because", "rationale"]
    availability: ["99.99", "zone", "region", "failover"]
    compliance: ["gdpr", "residency", "privacy"]
    cost: ["budget", "cost"]
  require_citations: true
  allowed_citation_hosts: ["learn.microsoft.com", "azure.microsoft.com"]
  max_words: 800
  minimum_decision_signals: 3
tags: ["live", "architecture", "release-gate"]
